<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuNNㄉ歌單</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            background: radial-gradient( circle at 0% 0%, rgba(59,130,246,.25), transparent 35% ), radial-gradient( circle at 100% 100%, rgba(99,102,241,.20), transparent 35% ), radial-gradient( circle at 50% 20%, rgba(255,255,255,.05), transparent 50% ), linear-gradient( 180deg, #334155 0%, #1e293b 40%, #0f172a 100% );
            min-height: 100vh;
            background-attachment: fixed;
        }

        .song-card {
            transition: all .3s ease;
        }

            .song-card:hover {
                transform: translateY(-6px);
                background: rgba(255,255,255,.15);
                box-shadow: 0 12px 30px rgba(0,0,0,.25), 0 0 20px rgba(59,130,246,.25);
            }

        .logo-title {
            font-size: 3.5rem;
            font-weight: 900;
            color: white;
            -webkit-text-stroke: 0.5px rgba(255,255,255,.08);
            letter-spacing: -1px;
        }

        body {
            font-family: 'Noto Sans TC',sans-serif;
        }
    </style>
</head>

<body class="p-4 md:p-8">
    <div class="fixed inset-0 pointer-events-none">
        <div class="absolute top-0 left-0 w-96 h-96 bg-cyan-400/20 rounded-full blur-3xl"></div>
        <div class="absolute bottom-0 right-0 w-96 h-96 bg-indigo-500/20 rounded-full blur-3xl"></div>
    </div>

    <div id="app"
         class="max-w-6xl mx-auto bg-white/15 backdrop-blur-xl rounded-3xl shadow-2xl p-6 border border-white/20 relative z-10">

        <h1 class="logo-title text-center mb-8">
            🎵 𝖫𝗎𝖭𝖭 𝖯𝖫𝖠𝖸𝖫𝖨𝖲𝖳
        </h1>

        <!-- 搜尋與分類 -->
        <div class="space-y-4 mb-8">

            <input v-model="searchQuery"
                   type="text"
                   placeholder="搜尋歌曲或歌手..."
                   class="w-full px-4 py-3 rounded-full bg-white/20 text-white placeholder:text-white/60 border border-white/20 focus:border-white/60 outline-none">

            <div class="flex flex-wrap gap-2">

                <button v-for="tag in allTags"
                        :key="tag"
                        @click="toggleTag(tag)"
                        :class="selectedTag === tag
                    ? 'bg-slate-200 text-slate-900'
                    : 'bg-white/10 text-white hover:bg-white/20'"
                        class="px-4 py-1 rounded-full text-sm font-medium transition">

                    {{ tag }}

                </button>

            </div>

        </div>

        <div v-if="loading"
             class="text-center py-20 text-white text-xl font-bold">

            資料讀取中...

        </div>

        <div v-else
             class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">

            <div v-for="song in filteredSongs"
                 :key="song['歌曲名稱']"
                 class="song-card bg-white/10 backdrop-blur-md border border-white/10 p-4 rounded-2xl flex justify-between items-center">

                <div>

                    <div class="text-lg font-medium text-slate-200">
                        {{ song['歌曲名稱'] }}
                    </div>

                    <div class="text-sm text-slate-300">
                        {{ song['演唱者名稱'] }}
                    </div>

                    <div class="mt-2 flex flex-wrap gap-1">

                        <span v-for="t in splitTags(song['風格分類'])"
                              :key="t"
                              class="text-[10px] bg-indigo-500/10 text-indigo-300 px-2 py-0.5 rounded-full border border-indigo-400/10">

                            {{ t }}

                        </span>

                    </div>

                </div>

                <button @click="copySong(song['歌曲名稱'])"
                        class="p-2 hover:bg-white/10 rounded-full transition text-xl text-white">

                    📋

                </button>

            </div>

        </div>

    </div>

    <script>

        const { createApp, ref, computed, onMounted } = Vue;

        createApp({

            setup() {

                const songs = ref([]);
                const loading = ref(true);
                const searchQuery = ref('');
                const selectedTag = ref('全部');

                const apiUrl =
                    'https://script.google.com/macros/s/AKfycbwLq8gX79QM1F9ZZI6HTZn-Qfh3-nzupBrwY-9uQhY3VgF4Q79wcrwrV5y8XAw_tQ24/exec';

                const fetchData = async () => {

                    try {

                        const res = await fetch(apiUrl);
                        const data = await res.json();

                        songs.value = Array.isArray(data)
                            ? data
                            : [];

                    } catch (e) {

                        console.error("讀取失敗", e);

                    } finally {

                        loading.value = false;

                    }

                };

                const allTags = computed(() => {

                    const tags = new Set(['全部']);

                    songs.value.forEach(s => {

                        const tagField = s['風格分類'];

                        if (tagField) {

                            tagField
                                .toString()
                                .split(/[,，\s]+/)
                                .forEach(t => {

                                    if (t.trim()) {

                                        tags.add(t.trim());

                                    }

                                });

                        }

                    });

                    return Array.from(tags);

                });

                const filteredSongs = computed(() => {

                    return songs.value.filter(s => {

                        const songName =
                            s['歌曲名稱']
                                ? s['歌曲名稱'].toString()
                                : '';

                        const artistName =
                            s['演唱者名稱']
                                ? s['演唱者名稱'].toString()
                                : '';

                        const tagField =
                            s['風格分類']
                                ? s['風格分類'].toString()
                                : '';

                        const matchSearch =
                            songName.includes(searchQuery.value) ||
                            artistName.includes(searchQuery.value);

                        const matchTag =
                            selectedTag.value === '全部' ||
                            tagField.includes(selectedTag.value);

                        return matchSearch && matchTag;

                    });

                });

                const splitTags = (tagStr) => {

                    if (!tagStr) return [];

                    return tagStr
                        .toString()
                        .split(/[,，\s]+/)
                        .filter(t => t.trim());

                };

                const toggleTag = (tag) => {

                    selectedTag.value = tag;

                };

                const copySong = (name) => {

                    navigator.clipboard.writeText(name);

                    alert(`已複製：${name}`);

                };

                onMounted(fetchData);

                return {

                    songs,
                    loading,
                    searchQuery,
                    selectedTag,
                    allTags,
                    filteredSongs,
                    splitTags,
                    toggleTag,
                    copySong

                };

            }

        }).mount('#app');

    </script>

</body>
</html>
